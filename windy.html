<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sailing Assistant Windy">
<title>Sailing Assistant &mdash; Windy</title>
<!-- NB: do NOT load Leaflet CSS here - Windy loads its own fixed styles; the Leaflet CSS hides Windy's overlay/timeline/menu toolbars -->
<script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
<script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
<style>
 html,body,#windy{margin:0;height:100%;width:100%}
 #back{position:absolute;top:8px;left:8px;z-index:10000;background:#fff;color:#0b3d66;font-weight:bold;
   text-decoration:none;padding:9px 14px;border-radius:7px;box-shadow:0 1px 5px rgba(0,0,0,.5);font-family:system-ui}
 #msg{position:absolute;top:46%;left:0;right:0;text-align:center;font-family:system-ui;color:#333;z-index:9998}
 .leaflet-tooltip{font-size:11px}
</style></head><body>
<div id="windy"></div>
<a id="back" href="index.html">&#8592; Chart</a>
<div id="msg">Loading Windy&hellip;</div>
<script>
// Cox Ledge / wind-farm exclusion polygon only (general keep-out area). The retired hardcoded Solo/Twin race's
// marks, courses and finish that used to sit alongside it here were unused and have been removed.
const D = {"ez": [{"id": "EZ01", "lat": 41.15833333333333, "lon": -71.26666666666667}, {"id": "EZ02", "lat": 41.23166666666667, "lon": -71.175}, {"id": "EZ03", "lat": 41.23166666666667, "lon": -71.05833333333334}, {"id": "EZ04", "lat": 41.13333333333333, "lon": -70.83333333333333}, {"id": "EZ05", "lat": 41.111666666666665, "lon": -70.83166666666666}, {"id": "EZ06", "lat": 41.075, "lon": -70.94166666666666}, {"id": "EZ07", "lat": 41.071666666666665, "lon": -71.19333333333333}]};
let KEY = "lXsLH7lUO9iXYZgssZSp100sjgXLz4Hd";
if(!KEY || KEY.slice(0,2)==='__'){ KEY = localStorage.getItem('windy_key') || (prompt('Paste your Windy API key:')||''); if(KEY) localStorage.setItem('windy_key',KEY); }
if(!KEY){ document.getElementById('msg').textContent='No Windy API key provided.'; }
else windyInit({key:KEY, verbose:false, lat:41.1, lon:-71.3, zoom:9}, windyAPI=>{
  const msg=document.getElementById('msg'); if(msg) msg.style.display='none';
  const map = windyAPI.map;
  L.polygon(D.ez.map(e=>[e.lat,e.lon]),{color:'#c00',weight:2,fillColor:'#c00',fillOpacity:.18})
    .bindPopup('Cox Ledge Exclusion Zone &mdash; do not enter').addTo(map);
  try{ (JSON.parse(localStorage.getItem('sa_saved')||'[]')).forEach((r,i)=>{ if(r.on===false) return;
    const col=['#0a7d2c','#b5179e','#f77f00','#3a0ca3','#006d77'][i%5];
    L.polyline(r.pts,{color:col,weight:3}).bindPopup('Saved: '+r.name).addTo(map); }); }catch(e){}
  try{ const dr=JSON.parse(localStorage.getItem('sa_route')||'[]'); if(dr.length>1)
    L.polyline(dr,{color:'#0a7d2c',weight:3,dashArray:'6 4'}).bindPopup('Drawn route').addTo(map); }catch(e){}
  try{ (JSON.parse(localStorage.getItem('sa_courses')||'[]')).forEach((c,i)=>{ if(c.on===false) return;
    const col=['#d00','#0a0','#06c','#c60','#909','#0aa'][i%6];
    L.polyline(c.pts,{color:col,weight:3}).bindPopup('Course: '+c.name).addTo(map); }); }catch(e){}
  // Loaded catalog / imported races (sa_races): parse GPX, draw each course option + start/finish/EZ + marks
  try{ const CCOL=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#00b4d8','#f032e6','#7cb342','#e6ab02','#469990','#9a6324','#1f78b4','#b15928','#6a3d9a'];
    (JSON.parse(localStorage.getItem('sa_races')||'[]')).forEach(r=>{
      let xml; try{ xml=new DOMParser().parseFromString(r.text,'application/xml'); }catch(_){ return; }
      if(xml.getElementsByTagName('parsererror').length) return;
      const tg=(el,t)=>Array.from(el.getElementsByTagNameNS('*',t)), nm=el=>{ const x=tg(el,'name')[0]; return x?x.textContent:''; };
      // Same colour slot (c0) and reverse flag the main page saved with the race, so Windy matches it.
      let ci=(r.c0!=null)?r.c0:0;
      const rev=pts=>(r.rev && pts.length>2) ? [pts[0],...pts.slice(1,-1).reverse(),pts[pts.length-1]] : pts;
      tg(xml,'rte').forEach(rt=>{ const pts=tg(rt,'rtept').map(p=>[+p.getAttribute('lat'),+p.getAttribute('lon')]); if(pts.length<2) return;
        const lbl=nm(rt), t=lbl.toLowerCase(), pop='<b>'+r.name+' - '+(lbl||'course')+'</b>';
        if(/exclus|restrict|prohibit|keep ?out|danger|no.?go/.test(t)) L.polygon(pts,{color:'#c00',weight:2,fillColor:'#c00',fillOpacity:0.15,dashArray:'4 3'}).bindPopup(pop).addTo(map);
        else if(/finish/.test(t)) L.polyline(pts,{color:'#0033cc',weight:4,dashArray:'6 4'}).bindPopup(pop).addTo(map);
        else if(/start/.test(t)) L.polyline(pts,{color:'#0a7d2c',weight:4,dashArray:'6 4'}).bindPopup(pop).addTo(map);
        else L.polyline(rev(pts),{color:CCOL[(ci++)%CCOL.length],weight:3}).bindPopup(pop+(r.rev?' (reversed)':'')).addTo(map); });
      tg(xml,'wpt').forEach(w=>{ L.circleMarker([+w.getAttribute('lat'),+w.getAttribute('lon')],{radius:4,color:'#333',weight:1,fillColor:'#fff',fillOpacity:1}).bindTooltip(nm(w),{direction:'right'}).addTo(map); });
    }); }catch(e){}
  // South Bay picked course (from the main-page Course library picker)
  try{ const pc=JSON.parse(localStorage.getItem('sa_course')||'null');
    if(pc && pc.code){ Promise.all([fetch('courses.json').then(r=>r.json()),fetch('southbay_marks.json').then(r=>r.json())])
      .then(([cj,mj])=>{ const set=cj.sets[pc.set||0], M=mj.marks; if(!set) return; const c=set.courses[pc.code]; if(!c) return;
        const pts=[]; if(set.start) pts.push(set.start);
        c.seq.forEach(([mk,side])=>{ const m=M[mk]; if(!m) return; pts.push([m.lat,m.lon]);
          L.circleMarker([m.lat,m.lon],{radius:5,color:'#6a0080',weight:2,fillColor:'#e040fb',fillOpacity:1})
            .bindTooltip(mk+(side==='fin'?' (finish)':side==='p'?' (port)':' (stbd)'),{direction:'top'}).addTo(map); });
        const last=c.seq[c.seq.length-1];
        if(set.finish){ const fm=M[set.finish.mark];                       // JYC: end at F -> Jamestown dock
          if(fm){ if(!(last&&last[0]===set.finish.mark)) pts.push([fm.lat,fm.lon]);
            if(set.finish.dock){ L.polyline([[fm.lat,fm.lon],set.finish.dock],{color:'#0033cc',weight:4,dashArray:'6 4'}).bindTooltip(set.finish.name,{direction:'top'}).addTo(map); } } }
        else if(set.start && !(last&&last[1]==='fin')){ pts.push(set.start); }
        L.polyline(pts,{color:'#d500f9',weight:3,opacity:.95}).bindPopup('Course '+pc.code+' &mdash; '+set.club+' &middot; '+(c.dist||'?')+' NM').addTo(map);
        if(set.start) L.circleMarker(set.start,{radius:6,color:'#fff',weight:2,fillColor:'#22c55e',fillOpacity:1})
          .bindTooltip('Start: '+set.startArea,{direction:'top'}).addTo(map);
      }).catch(()=>{}); } }catch(e){}
  if('geolocation' in navigator){ let bm=null,first=true;
    navigator.geolocation.watchPosition(p=>{ const ll=[p.coords.latitude,p.coords.longitude];
      if(!bm){ bm=L.circleMarker(ll,{radius:6,color:'#fff',weight:2,fillColor:'#c1121f',fillOpacity:1}).addTo(map).bindTooltip('You'); }
      else bm.setLatLng(ll); if(first){ map.setView(ll,10); first=false; } }, ()=>{}, {enableHighAccuracy:true,maximumAge:3000}); }
});
</script>
<div style="position:absolute;bottom:2px;right:4px;z-index:9999;font:11px system-ui;color:#bbb">build <span id="buildstamp">&mdash;</span></div>
<script>
// Read from the page's own Last-Modified - the literal date that used to be here never changed between deploys.
(function(){ var el=document.getElementById('buildstamp'), d=new Date(document.lastModified); if(!el||isNaN(d)) return;
  function p(n){ return String(n).padStart(2,'0'); }
  el.textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); })();
</script>
</body></html>
